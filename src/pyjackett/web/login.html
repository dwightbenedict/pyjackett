<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Jackett · Sign In</title>
  <link rel="icon" href="__BASE_PATH__/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="__BASE_PATH__/static/app.css">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="__BASE_PATH__/UI/Login">
    <span class="brand-mark large" aria-hidden="true"></span>
    <h1>Jackett</h1>
    <p class="muted">Sign in to continue.</p>
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="form-error" hidden>Incorrect username or password.</p>
    <button class="btn primary block" type="submit">Sign In</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("error")) {
      document.getElementById("login-error").hidden = false;
    }
  </script>
</body>
</html>
