---
id: faketracker
name: Fake Tracker
description: "An HTML tracker used by the test-suite"
language: en-US
type: public
encoding: UTF-8
links:
  - https://fake.test/

caps:
  categorymappings:
    - {id: 1, cat: Movies/HD, desc: "Movies HD"}
    - {id: 2, cat: TV, desc: "Television"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]

settings: []

download:
  selectors:
    - selector: a.dl
      attribute: href

search:
  paths:
    - path: search
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: table.results > tbody > tr
    filters:
      - name: andmatch
  fields:
    category:
      selector: td.cat
    title:
      selector: td.name a
    details:
      selector: td.name a
      attribute: href
    download:
      selector: td.name a
      attribute: href
      filters:
        - {name: replace, args: ["/details/", "/torrent/"]}
    size:
      selector: td.size
    seeders:
      selector: td.seeds
    leechers:
      selector: td.leech
    date:
      selector: td.date
      filters:
        - {name: append, args: " +00:00"}
        - {name: dateparse, args: "yyyy-MM-dd HH:mm:ss zzz"}
