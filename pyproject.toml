[project]
name = "pyjackett"
version = "0.1.0"
description = "A Python port of Jackett: API support for your favorite torrent trackers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-2.0-only" }
dependencies = [
    "cryptography>=42",
    "curl_cffi>=0.7",
    "fastapi>=0.115",
    "python-dateutil>=2.9",
    "regex>=2024.5",
    "selectolax>=0.3.29",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
pyjackett = "pyjackett.__main__:main"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "import-linter",
    "pre-commit",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyjackett"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade: List->list, Optional[X]->X | None, PEP 695
    "ANN",      # require annotations
    "ASYNC",    # blocking calls in async code
    "B",        # bugbear
    "A",        # shadowing builtins
    "C4",       # comprehensions
    "C90",      # complexity (mccabe)
    "SIM",      # simplify
    "PL",       # pylint: max-args, max-statements, magic values
    "RET",      # return consistency
    "TRY",      # exception handling
    "BLE",      # blind except
    "EM",       # exception message formatting
    "FBT",      # boolean trap (flag parameters)
    "PTH",      # pathlib
    "T20",      # no print
    "S",        # security
    "PT",       # pytest style
    "ARG",      # unused arguments
    "ERA",      # commented-out code
    "TC",       # type-checking-only imports
    "RUF",      # ruff-specific
    "PERF",     # performance anti-patterns
    "DTZ",      # naive datetimes
    "ISC",      # implicit string concatenation
    "TID",      # banned relative imports
]
ignore = [
    "COM812", "ISC001",  # clash with the formatter
    "TRY003",         # long messages in exceptions are fine with EM rules on
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4          # 3 params + self; group more into a dataclass
max-statements = 20
max-branches = 8
max-returns = 4

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.flake8-bugbear]
# Allow framework "default = Depends(...)" style parameters
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "ARG", "FBT"]
"src/pyjackett/__main__.py" = ["T20"]            # entry point may print

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=pyjackett --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------- coverage (fixed at 100%)
[tool.coverage.run]
branch = true
source = ["pyjackett"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "pyjackett"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> adapters -> services -> domain"
type = "layers"
layers = [
    "pyjackett.interfaces",
    "pyjackett.adapters",
    "pyjackett.services",
    "pyjackett.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no I/O or framework libraries)"
type = "forbidden"
source_modules = ["pyjackett.domain"]
forbidden_modules = [
    "requests", "httpx", "sqlalchemy", "sqlite3", "fastapi", "nicegui", "reflex", "click", "typer",
    "psycopg", "asyncpg", "pymysql", "aiomysql", "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "No heavyweight dependencies (512 MB budget on the free tier)"
type = "forbidden"
source_modules = ["pyjackett"]
forbidden_modules = [
    "pandas", "numpy", "scipy", "sklearn", "torch", "tensorflow", "matplotlib", "seaborn",
    "selenium", "playwright", "cv2",
]

[[tool.importlinter.contracts]]
name = "Core is UI-free (domain, services, adapters never import a UI framework)"
type = "forbidden"
source_modules = [
    "pyjackett.domain", "pyjackett.services", "pyjackett.adapters",
]
forbidden_modules = [
    "fastapi", "starlette", "nicegui", "reflex", "typer", "click", "flask", "streamlit", "flet",
    "pyjackett.interfaces",
]
