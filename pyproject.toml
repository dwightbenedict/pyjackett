[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyjackett"
version = "0.1.0"
description = "A Python port of Jackett: API support for your favorite torrent trackers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "fastapi>=0.110",
    "httpx[socks]>=0.27",
    "lxml>=5.0",
    "html5lib>=1.1",
    "python-dateutil>=2.9",
    "regex>=2024.5",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pycodestyle>=2.11"]

[project.scripts]
pyjackett = "pyjackett.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyjackett"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "N", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pycodestyle]
max-line-length = 79
